services:
  - type: web
    name: modo-matematika-4
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 1 --threads 4 --timeout 120 --bind 0.0.0.0:$PORT app:app
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: FLASK_SECRET_KEY
        generateValue: true
      - key: EMAILJS_SERVICE_ID
        value: service_eqm6vxw
      - key: EMAILJS_TEMPLATE_ID
        value: template_oxirbqr
      - key: EMAILJS_PUBLIC_KEY
        value: oXqaExjsVGKYeodsm
      - key: RESULT_EMAIL
        value: charming_nastena@mail.ru
