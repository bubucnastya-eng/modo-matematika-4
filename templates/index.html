<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>МОДО — математика 4 класс</title><style>
*{box-sizing:border-box}body{margin:0;background:#eef3f9;color:#1b2938;font:16px/1.5 system-ui,-apple-system,Arial}header{background:#174a7e;color:white;padding:24px 16px}header h1{font-size:24px;margin:0}main{max-width:850px;margin:20px auto;padding:0 12px}.panel,.question{background:white;border-radius:14px;padding:19px;margin:13px 0;box-shadow:0 2px 8px #1232}input[type=text]{display:block;width:100%;padding:13px;font-size:16px;border:1px solid #bbc7d5;border-radius:8px;margin:7px 0 15px}.option{display:flex;align-items:flex-start;gap:12px;border:1px solid #d5dfeb;padding:13px;margin:9px 0;border-radius:9px;cursor:pointer}.option:has(input:checked){background:#e8f4ff;border-color:#1875b7}.option input{margin-top:5px;flex-shrink:0}button{background:#167747;color:white;border:0;border-radius:9px;padding:14px 18px;font-weight:700;font-size:16px;cursor:pointer;min-height:46px}button:disabled{opacity:.5}.qtitle{font-weight:700;margin-bottom:10px}.muted{color:#576779}.good{color:#08783b}.bad{color:#ae2630}.bar{height:9px;background:#dce4ec;border-radius:6px;overflow:hidden}.bar div{background:#1e9659;height:100%;width:0}.review{padding:12px;border-left:4px solid #b63236;background:#fff8f8;margin:10px 0}.review.ok{border-color:#17814c;background:#f1faf4}#result{display:none}#status{font-weight:600}@media(max-width:600px){header h1{font-size:21px}.panel,.question{padding:15px}}
</style></head><body><header><h1>Тренажёр МОДО — математика</h1><div>4 класс · 30 вопросов · Новые задания при обновлении</div></header><main>
<section class="panel"><label>Фамилия и имя ученика<input id="name" type="text" autocomplete="name" placeholder="Например, Иванова Анна" required></label><label>Класс<input id="school_class" type="text" placeholder="Например, 4 А" required></label><div id="status">Загрузка заданий...</div><p class="muted" id="source"></p><div id="progress">Отвечено: 0 из 30</div><div class="bar"><div id="bar"></div></div></section>
<div id="quiz"></div><section class="panel"><button id="finish" disabled>Завершить тест и отправить результат</button><p class="muted">После завершения результаты будут отправлены учителю, если почта настроена.</p></section><section id="result" class="panel"></section></main>
<script>
let quizId='', questions=[], completed=false;
const $=id=>document.getElementById(id);
function escapeHTML(x){return String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function answers(){return questions.map((_,i)=>{let r=document.querySelector('input[name="q'+i+'"]:checked');return r?Number(r.value):null;});}
function progress(){let n=answers().filter(x=>x!==null).length;$('progress').textContent=`Отвечено: ${n} из ${questions.length}`;$('bar').style.width=(100*n/questions.length)+'%';}
async function load(){try{let response=await fetch('/api/questions',{cache:'no-store'});if(!response.ok)throw Error('Сервер не отвечает');let data=await response.json();quizId=data.quiz_id;questions=data.questions;$('source').textContent='Источник: '+data.source;$('quiz').replaceChildren();questions.forEach((q,i)=>{let section=document.createElement('section');section.className='question';let title=document.createElement('div');title.className='qtitle';title.textContent=(i+1)+'. '+q.q;section.append(title);q.o.forEach((opt,j)=>{let label=document.createElement('label');label.className='option';let input=document.createElement('input');input.type='radio';input.name='q'+i;input.value=j;input.addEventListener('change',progress);let span=document.createElement('span');span.textContent=String.fromCharCode(65+j)+') '+opt;label.append(input,span);section.append(label)});$('quiz').append(section)});$('status').textContent='Тест готов. Удачи!';$('finish').disabled=false;progress();}catch(e){$('status').textContent='Ошибка загрузки: '+e.message;}}
$('finish').addEventListener('click',async()=>{if(completed)return;let name=$('name').value.trim(),school_class=$('school_class').value.trim();if(!name||!school_class){alert('Укажите фамилию, имя и класс.');return;}if(answers().some(x=>x===null)&&!confirm('Есть вопросы без ответа. Завершить тест?'))return;$('finish').disabled=true;$('status').textContent='Проверяем ответы и отправляем результат...';try{let res=await fetch('/api/submit',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({quiz_id:quizId,name,school_class,answers:answers()})});let data=await res.json();if(!res.ok)throw Error(data.error||'Ошибка сервера');completed=true;document.querySelectorAll('input[type=radio]').forEach(x=>x.disabled=true);let html=`<h2>Результат: ${data.score} из ${data.total} (${data.percent}%)</h2>`;html+=data.email_sent?'<p class="good">Результат отправлен учителю на почту.</p>':'<p class="bad">Результат подсчитан, но письмо НЕ отправлено: '+escapeHTML(data.email_error)+'</p>';html+='<h3>Разбор ответов</h3>';data.review.forEach((r,i)=>{html+=`<div class="review ${r.ok?'ok':''}"><b>${i+1}. ${escapeHTML(r.q)}</b><p>Твой ответ: ${escapeHTML(r.selected)}</p><p>Правильный ответ: ${escapeHTML(r.correct)}</p><p>${escapeHTML(r.explanation)}</p></div>`});$('result').innerHTML=html;$('result').style.display='block';$('status').textContent='Тест завершён';$('result').scrollIntoView({behavior:'smooth'});}catch(e){$('status').textContent='Ошибка: '+e.message;$('finish').disabled=false;}});
load();
</script></body></html>
